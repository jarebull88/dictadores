<div id="app">

  <section id="screen-start" class="screen portada">
    <!-- 3 nov, Jorge: por ahora solo el título y los dos botones, centrados (sin cartel ni lema) hasta que se trabaje la portada -->
    <h1 class="logo" id="logo"><span class="solo-lector">Comandante, ¡ordene!</span></h1>
    <nav class="menu-portada">
      <button class="opcion-portada principal" id="btn-comenzar" type="button">Comenzar partida</button>
      <button class="opcion-portada secundaria" id="btn-repasar" type="button">Cómo se juega</button>
    </nav>
  </section>

  <section id="screen-name" class="screen pantalla-carta pantalla-nombre hidden">
    <div class="cabecera-carta">
      <h1 class="titulo" id="nombre-era-1"></h1>
      <p class="intro">Derrocaste al tirano y el Pueblo te aclama. Ahora debes consolidar la Revolución y sobrevivir a sus primeros años.</p>
    </div>
    <div class="escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta-nombre" role="group" aria-label="Arrastra a la derecha para empezar la partida o a la izquierda para volver"></div>
    </div>
    <p class="nombre-leyenda" id="nombre-leyenda">El Comandante</p>
  </section>

  <section id="screen-game" class="screen hidden">
    <div class="cabecera">
      <div class="barras" id="barras"></div>
    </div>
    <div class="mensaje" id="mensaje"></div>
    <div class="escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta" role="group" aria-label="Carta de decisión"></div>
    </div>
    <div class="pie-juego">
      <div class="zona-leyenda"><div class="leyenda" id="leyenda"></div></div>
      <div class="anio" id="anio" aria-label="Año"></div>
      <div class="ranuras" id="ranuras" role="group" aria-label="Secuelas del régimen"></div>
      <button class="boton-menu" id="btn-menu" type="button" aria-label="Menú" aria-haspopup="dialog" aria-expanded="false" aria-controls="archivo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.41 6 5 7.41 9.58 12 5 16.59 6.41 18l6-6zM13 6l-1.41 1.41L16.17 12l-4.58 4.59L13 18l6-6z"/></svg></button>
    </div>
    <div class="banda" id="banda" role="status" aria-live="polite"><span id="banda-texto"></span></div>
    <div class="popup hidden" id="popup" role="dialog"></div>
  </section>

    <!-- 29 oct: menú a pantalla completa. Arriba, cuatro iconos del tamaño de los de las fuerzas; abajo, el espacio libre para la galería, los ajustes o abandonar -->
    <div class="archivo hidden" id="archivo" role="dialog" aria-label="Menú">
      <div class="archivo-iconos" id="archivo-iconos">
        <button class="ic-menu" id="btn-recompensas" type="button" aria-label="Recompensas"><span class="ic-cuadro"></span></button>
        <button class="ic-menu" id="btn-logros" type="button" aria-label="Logros"><span class="ic-cuadro"></span></button>
        <button class="ic-menu" id="btn-config" type="button" aria-label="Configuración"><span class="ic-cuadro"></span></button>
        <button class="ic-menu" id="btn-abandonar" type="button" aria-label="Abandonar partida"><span class="ic-cuadro"></span></button>
      </div>
      <div class="archivo-cab"><h2 class="titulo archivo-titulo" id="archivo-titulo"></h2></div>
      <div class="archivo-rejilla" id="archivo-rejilla"></div>
      <div class="archivo-panel hidden" id="panel-config"><button class="modo principal" id="btn-sonido" type="button"><b>Sonido</b></button></div>
      <div class="archivo-panel hidden" id="panel-abandono"><button class="modo principal" id="btn-salir" type="button"><b>Abandonar partida</b></button></div>
      <div class="logro-vista hidden" id="archivo-abrir"></div>
      <button class="boton-menu boton-menu-volver" id="btn-menu-cerrar" type="button" aria-label="Volver a la partida"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.41 6 5 7.41 9.58 12 5 16.59 6.41 18l6-6zM13 6l-1.41 1.41L16.17 12l-4.58 4.59L13 18l6-6z"/></svg></button>
    </div>

  <section id="screen-era" class="screen pantalla-carta hidden">
    <div class="cabecera-carta">
      <h1 class="titulo" id="era-titulo"></h1>
      <p class="era-texto" id="era-texto"></p>
    </div>
    <div class="escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta-era" role="group" aria-label="Arrastra a la derecha para seguir gobernando o a la izquierda para retirarte"></div>
    </div>
    <p class="era-anios" id="era-anios"></p>
  </section>

  <section id="screen-end" class="screen pantalla-texto hidden">
    <div class="fin-cab">
      <h1 class="titulo fin-principal" id="fin-principal"></h1>
      <h2 class="titulo fin-causa" id="fin-titulo"></h2>
      <p class="relato" id="fin-texto"></p>
    </div>
    <!-- Al caer: la causa en una carta; derecha = jugar de nuevo, izquierda = volver a la portada -->
    <div class="escenario fin-escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta-fin" role="group" aria-label="Arrastra a la derecha para jugar de nuevo o a la izquierda para volver a la portada"></div>
    </div>
    <div class="fin-pie-zona">
      <p class="fin-pie" id="fin-pie"></p>
      <p class="fin-anios" id="fin-anios"></p>
    </div>
    <div class="esquela" id="fin-esquela"></div>
    <div class="acciones" id="fin-acciones">
      <button class="modo principal" id="btn-repetir" type="button"><b>Jugar de nuevo</b></button>
    </div>
  </section>

</div>
