<div id="app">

  <section id="screen-start" class="screen portada">
    <h1 class="logo" id="logo"><span class="solo-lector">Comandante, ¡ordene!</span></h1>
    <nav class="menu-portada">
      <button class="opcion-portada principal" id="btn-comenzar" type="button">Comenzar partida</button>
      <button class="opcion-portada secundaria" id="btn-repasar" type="button">Cómo se juega</button>
    </nav>
    <div class="escena-portada" id="escena-portada" aria-hidden="true"></div>
  </section>

  <section id="screen-name" class="screen pantalla-carta pantalla-nombre hidden">
    <div class="cabecera-carta">
      <h1 class="titulo" id="nombre-era-1"></h1>
      <p class="intro">Has derrocado al tirano. La Revolución promete un futuro mejor. El Pueblo confía en ti, Comandante.</p>
    </div>
    <div class="escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta-nombre" role="group" aria-label="Arrastra a la derecha para empezar la partida o a la izquierda para volver"></div>
    </div>
    <div class="campo">
      <label for="input-nombre" class="solo-lector">Tu nombre</label>
      <input id="input-nombre" type="text" maxlength="14" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Tu nombre">
      <p class="error" id="nombre-error"></p>
    </div>
  </section>

  <section id="screen-game" class="screen hidden">
    <div class="cabecera">
      <div class="barras" id="barras"></div>
      <button class="boton-menu" id="btn-menu" type="button" aria-label="Menú" aria-haspopup="true" aria-expanded="false" aria-controls="menu-juego"><svg viewBox="0 0 20 18" aria-hidden="true"><path d="M0 0h20v3H0zM0 7.5h20v3H0zM0 15h20v3H0z"/></svg></button>
      <div class="menu-juego hidden" id="menu-juego" role="menu">
        <button class="opcion-menu" id="btn-logros" type="button" role="menuitem">Logros</button>
        <button class="opcion-menu" id="btn-sonido" type="button" role="menuitem">Sonido</button>
        <button class="opcion-menu" id="btn-salir" type="button" role="menuitem">Abandonar partida</button>
      </div>
    </div>
    <div class="mensaje" id="mensaje"></div>
    <div class="escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta" role="group" aria-label="Carta de decisión"></div>
    </div>
    <div class="pie-juego">
      <div class="dictador"><b id="nombre-dictador"></b><small id="anios-poder"></small></div>
      <div class="ranuras" id="ranuras" role="group" aria-label="Estados del régimen"></div>
    </div>
    <div class="popup hidden" id="popup" role="dialog"></div>
  </section>

  <section id="screen-era" class="screen pantalla-carta hidden">
    <div class="cabecera-carta">
      <h1 class="titulo" id="era-titulo"></h1>
      <p class="era-texto" id="era-texto"></p>
    </div>
    <div class="escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta-era" role="group" aria-label="Arrastra a la derecha para seguir gobernando o a la izquierda para retirarte"></div>
    </div>
    <p class="era-anios" id="era-anios"></p>
  </section>

  <section id="screen-end" class="screen pantalla-texto hidden">
    <div class="fin-cab">
      <h1 class="titulo fin-principal" id="fin-principal"></h1>
      <h2 class="titulo fin-causa" id="fin-titulo"></h2>
      <p class="relato" id="fin-texto"></p>
    </div>
    <!-- Al caer: la causa en una carta; derecha = jugar de nuevo, izquierda = volver a la portada -->
    <div class="escenario fin-escenario">
      <div class="pila" aria-hidden="true"><div class="capa"></div></div>
      <div class="carta" id="carta-fin" role="group" aria-label="Arrastra a la derecha para jugar de nuevo o a la izquierda para volver a la portada"></div>
    </div>
    <p class="fin-anios" id="fin-anios"></p>
    <div class="esquela" id="fin-esquela"></div>
    <div class="acciones" id="fin-acciones">
      <button class="modo principal" id="btn-repetir" type="button"><b>Jugar de nuevo</b></button>
    </div>
  </section>

</div>
