<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba: descubrir una carta</title>
<style>
:root{--crema:#F0E9D6;--tinta:#23211E;--blanco:#fff;--rojo:#B0362A;--mostaza:#D8A02A;--azul:#1D51A0;--fondo:var(--crema)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--crema);color:var(--tinta);font-family:system-ui,sans-serif;overflow:hidden}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
h1{font:400 28px/1 "Impact","Arial Narrow",sans-serif;text-transform:uppercase;text-align:center;margin:18px 0 6px;color:var(--rojo)}
.sub{text-align:center;font-size:14px;margin:0 16px 12px;opacity:.8}
.rejilla{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:min(88vw,420px);margin:0 auto}
.hueco{aspect-ratio:1;border:2px solid var(--tinta);display:flex;align-items:center;justify-content:center;font:700 20px sans-serif;opacity:.35}
.hueco.nuevo{opacity:1;background:var(--mostaza);cursor:pointer;font-size:15px;text-transform:uppercase;animation:lat 1.2s infinite alternate;border-width:3px}
@keyframes lat{to{transform:scale(1.06)}}
.barra{margin-top:auto;padding:12px;display:grid;gap:8px;background:#0001}
.barra b{font-size:13px}
.fila{display:flex;gap:6px;flex-wrap:wrap}
button.v,button.f{flex:1 1 40%;padding:10px 6px;border:2px solid var(--tinta);background:#fff;font:600 14px sans-serif;cursor:pointer}
button.on{background:var(--tinta);color:#fff}
#visor{position:fixed;inset:0;background:var(--fondo);box-shadow:0 0 0 60px var(--fondo);overflow:hidden;display:none;z-index:5}
#visor.si{display:block}
.capa{position:absolute;inset:0;pointer-events:none}
.rayos{position:absolute;left:50%;top:50%;width:260vmax;height:260vmax;transform:translate(-50%,-50%);pointer-events:none;opacity:0;
 -webkit-mask-image:radial-gradient(circle closest-side,transparent 14%,#000 52%);mask-image:radial-gradient(circle closest-side,transparent 14%,#000 52%)}
.r1{background:repeating-conic-gradient(from 3deg,#fff 0 .9deg,transparent .9deg 3.3deg),repeating-conic-gradient(from 0deg,#fff 0 .4deg,transparent .4deg 5.3deg)}
.r2{background:repeating-conic-gradient(from 8deg,#fff 0 .5deg,transparent .5deg 2.4deg),repeating-conic-gradient(from 1deg,#fff 0 1.4deg,transparent 1.4deg 9deg)}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}
.onda{position:absolute;left:50%;top:50%;width:40vmin;height:40vmin;margin:-20vmin 0 0 -20vmin;border:8px solid #fff;border-radius:50%;opacity:0;pointer-events:none}
.chispa{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);opacity:0;pointer-events:none}
.carta{position:absolute;background:#fff;border:2px solid var(--tinta);padding:3.5%;transform-origin:center}
.carta img{display:block;width:100%;height:100%;object-fit:cover}
.pie{position:absolute;left:0;right:0;bottom:6%;text-align:center;font-size:15px;opacity:0}
.pie.si{opacity:1;transition:opacity .6s}
.volver{position:absolute;top:12px;right:14px;background:none;border:none;text-decoration:underline;font:600 15px sans-serif;color:var(--tinta);z-index:3;cursor:pointer}
.titulo{position:absolute;left:0;right:0;text-align:center;font:400 30px/1 "Impact","Arial Narrow",sans-serif;text-transform:uppercase;color:var(--rojo);opacity:0}
@media (prefers-reduced-motion:reduce){.hueco.nuevo{animation:none}}
</style></head><body>

function limpiar(){tmr.forEach(clearTimeout);tmr=[];$("visor").getAnimations({subtree:true}).forEach(a=>a.cancel());document.querySelectorAll(".chispa,.onda.extra").forEach(e=>e.remove());["r1","r2","flash","titulo"].forEach(i=>$(i).style.opacity=0);$("pie").classList.remove("si");$("capa").style.transform="";$("visor").style.transform=""}
function colocarCarta(){const s=Math.min(innerWidth*.8,innerHeight*.5),c=$("carta");c.style.width=c.style.height=s+"px";c.style.left=(innerWidth-s)/2+"px";c.style.top=(innerHeight*.5-s/2+10)+"px";const t=$("titulo");t.style.top=(innerHeight*.5-s/2-70)+"px";return s}
function desde(extra=""){const a=$("celda").getBoundingClientRect(),c=$("carta").getBoundingClientRect();const k=a.width/c.width,dx=a.left+a.width/2-(c.left+c.width/2),dy=a.top+a.height/2-(c.top+c.height/2);return`translate(${dx}px,${dy}px) scale(${k}) ${extra}`}
function onda(delay,dur,esc=4,extra=false){const o=document.createElement("div");o.className="onda"+(extra?" extra":"");$("visor").insertBefore(o,$("carta"));o.animate([{opacity:.95,transform:"scale(.2)"},{opacity:0,transform:`scale(${esc})`}],{duration:dur,delay,easing:"cubic-bezier(.1,.7,.3,1)",fill:"both"})}
function flash(delay,dur=500,max=1){$("flash").animate([{opacity:0},{opacity:max,offset:.18},{opacity:0}],{duration:dur,delay,fill:"both"})}
function chispas(n,delay){for(let i=0;i<n;i++){const c=document.createElement("div");c.className="chispa";$("visor").appendChild(c);const ang=Math.random()*Math.PI*2,d=(.25+Math.random()*.6)*Math.max(innerWidth,innerHeight),s=.6+Math.random()*1.6;c.animate([{opacity:1,transform:"translate(0,0) scale(.2) rotate(0)"},{opacity:1,offset:.3,transform:`translate(${Math.cos(ang)*d*.5}px,${Math.sin(ang)*d*.5}px) scale(${s}) rotate(90deg)`},{opacity:0,transform:`translate(${Math.cos(ang)*d}px,${Math.sin(ang)*d}px) scale(0) rotate(240deg)`}],{duration:900+Math.random()*700,delay:delay+Math.random()*250,easing:"ease-out",fill:"both"})}}
function temblor(delay,dur=400,px=10){const f=[];for(let i=0;i<=8;i++)f.push({transform:i===8?"none":`translate(${(Math.random()*2-1)*px*(1-i/8)}px,${(Math.random()*2-1)*px*(1-i/8)}px)`});$("visor").animate(f,{duration:dur,delay,fill:"none"})}

 ()=>{ // Explosión

  $("r1").animate([{opacity:0,transform:T(.4,0)},{opacity:1,transform:T(1,180),offset:.1},{opacity:1,transform:T(1,360)}],{duration:9000,iterations:Infinity,easing:"linear",fill:"both"});

  $("capa").animate([{transform:"scale(1)"},{transform:"scale(1.1)"}],{duration:900,direction:"alternate",iterations:Infinity,easing:"ease-in-out"});

 ()=>{ // Impacto
  colocarCarta();

  flash(780,500,1);flash(1500,300,.5);temblor(800,550,16);
  onda(800,1100,5);onda(950,1100,4);onda(1100,1100,3,true);chispas(28,800);pieTitulo(1300);
 }
];
function jugar(){limpiar();$("visor").style.setProperty("--fondo",fondo);$("visor").classList.add("si");A[ver]()}
