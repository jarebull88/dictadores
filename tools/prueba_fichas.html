<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:L;font-weight:400;src:url(../assets/fuentes/londrina-solid-latin-400-normal.woff2)}
@font-face{font-family:L;font-weight:300;src:url(../assets/fuentes/londrina-solid-latin-300-normal.woff2)}
@font-face{font-family:S;font-weight:400;src:url(../assets/fuentes/sofia-sans-semi-condensed-latin-400-normal.woff2)}
@font-face{font-family:S;font-weight:800;src:url(../assets/fuentes/sofia-sans-semi-condensed-latin-800-normal.woff2)}
body{margin:0;background:#F0E9D6;font-family:S;padding:16px;display:grid;grid-template-columns:repeat(2,340px);gap:18px 16px}
h2{grid-column:1/-1;margin:6px 0 -8px;font:400 22px L;text-transform:uppercase;color:#201D14}
.carta{width:340px;height:340px;box-sizing:border-box;background:#fff;border:1.5px solid #201D14;padding:11px}
.in{width:100%;height:100%;box-sizing:border-box;position:relative;overflow:hidden;background:var(--f);color:var(--t)}
.fit{display:block;white-space:nowrap;text-transform:uppercase;line-height:.84}
p{margin:0;font-size:14.5px;line-height:1.25}
b{font-weight:800}
/* A créditos */
.A .in{padding:14px 16px;display:flex;flex-direction:column}
.A .n1{font:300 10px L}.A .n2{font:400 10px L;margin-top:2px}
.A .banda{margin:10px -16px 10px;padding:5px 16px;background:var(--a);color:var(--ta);font:800 13px S;text-transform:uppercase;letter-spacing:.06em}
.A .raya{border-top:4px solid var(--t);margin:8px 0 6px}
/* B sello */
.B .in{padding:16px}
.B .txt{position:relative;z-index:1}
.B .nom{position:absolute;left:14px;right:14px;bottom:12px}
.B .nom .fit{font:400 10px L}
.B .nom .n1{font-weight:300}
.B .sello{position:absolute;right:10px;transform:rotate(-8deg);border:3px solid var(--a);color:var(--a);padding:3px 10px 1px;font:400 22px L;text-transform:uppercase}
/* C bloques */
.C .in{display:grid;grid-template-rows:46% 54%;grid-template-columns:1fr 34px}
.C .arriba{background:var(--f);color:var(--t);padding:12px 6px 8px 14px;display:flex;flex-direction:column;justify-content:flex-end}
.C .arriba .fit{font:400 10px L}.C .arriba .n1{font-weight:300}
.C .abajo{background:var(--b);color:var(--tb);padding:10px 8px 10px 14px}
.C .lado{grid-row:1/3;grid-column:2;background:var(--a);color:var(--ta);writing-mode:vertical-rl;transform:rotate(180deg);font:300 21px L;text-transform:uppercase;display:flex;align-items:center;justify-content:center;white-space:nowrap}
.C .abajo p+p{margin-top:6px}
</style></head><body></body>
<script>
const P=[
 {n1:"Octavio",n2:"Sarria",cargo:"Ministro del Interior",h:"Oficinista de banco que en la sierra interrogaba a los recién llegados y lleva una libreta con el nombre de cada compañero.",nota:"Este informe lo ha redactado él mismo.",f:"#201D14",t:"#FFFFFF",a:"#1D51A0",ta:"#FFFFFF",b:"#FFFFFF",tb:"#201D14"},
 {n1:"Mirta",n2:"Albear",cargo:"Ministra de Cultura",h:"Locutora de Radio Machete cuya voz escuchaba el país de noche y a escondidas.",nota:"Sostiene en público que la palabra libera, por lo que se aconseja revisar sus poemas antes de cada emisión.",f:"#B0362A",t:"#FFFFFF",a:"#D8A02A",ta:"#201D14",b:"#D8A02A",tb:"#201D14"}];
const st=p=>`--f:${p.f};--t:${p.t};--a:${p.a};--ta:${p.ta};--b:${p.b};--tb:${p.tb}`;
let h="";
h+="<h2>A · Créditos</h2>";
for(const p of P)h+=`<div class="carta A"><div class="in" style="${st(p)}"><div class="nomA"><span class="fit n1">${p.n1}</span><span class="fit n2">${p.n2}</span></div><div class="banda">${p.cargo}</div><p>${p.h}</p><div class="raya"></div><p><b>Nota:</b> ${p.nota}</p></div></div>`;
h+="<h2>B · Sello</h2>";
for(const p of P)h+=`<div class="carta B"><div class="in" style="${st(p)}"><div class="txt"><p>${p.h}</p><p style="margin-top:6px"><b>Nota:</b> ${p.nota}</p></div><div class="sello">${p.cargo}</div><div class="nom"><span class="fit n1">${p.n1}</span><span class="fit">${p.n2}</span></div></div></div>`;
h+="<h2>C · Bloques</h2>";
for(const p of P)h+=`<div class="carta C"><div class="in" style="${st(p)}"><div class="arriba"><span class="fit n1">${p.n1}</span><span class="fit">${p.n2}</span></div><div class="lado">${p.cargo}</div><div class="abajo"><p>${p.h}</p><p><b>Nota:</b> ${p.nota}</p></div></div></div>`;
document.body.innerHTML+=h;
document.fonts.ready.then(()=>{
 const c=document.createElement('canvas').getContext('2d');
 const fit=(e,w)=>{const cs=getComputedStyle(e);c.font=`${cs.fontWeight} 100px L`;const m=c.measureText(e.textContent.toUpperCase()).width;e.style.fontSize=(100*w/m*0.98)+'px';};
 const ancho=el=>{const cs=getComputedStyle(el);return el.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);};
 for(const e of document.querySelectorAll('.fit'))fit(e,ancho(e.closest('.nom')||e.parentElement));
 // tope de altura: el nombre no puede pisar el texto
 const tope=(caja,max)=>{const fs=caja.querySelectorAll('.fit');const tot=[...fs].reduce((a,f)=>a+f.getBoundingClientRect().height,0);if(tot>max)for(const f of fs)f.style.fontSize=(parseFloat(f.style.fontSize)*max/tot)+'px';};
 for(const e of document.querySelectorAll('.C .arriba'))tope(e,e.clientHeight-22);
 for(const e of document.querySelectorAll('.B .in')){const t=e.querySelector('.txt'),s=e.querySelector('.sello');tope(e.querySelector('.nom'),e.clientHeight-t.offsetHeight-s.offsetHeight-40);
   const nom=e.querySelector('.nom');s.style.top=(nom.offsetTop-s.offsetHeight-6)+'px';}
 for(const e of document.querySelectorAll('.A .in')){const n=e.querySelector('.nomA');let resto=0;for(const k of e.children)if(k!==n){const cs=getComputedStyle(k);resto+=k.offsetHeight+parseFloat(cs.marginTop)+parseFloat(cs.marginBottom);}tope(n,e.clientHeight-28-resto);}
 document.body.dataset.ok=1;});
</script></html>
